[package]
name = "database-ide"
version = "0.1.0"
edition = "2021"

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
